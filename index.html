<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Finder - Free & Private</title>
    <style>
        :root {
            --neon: #00ff88;
            --dark: #0a0a0a;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #151515;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            border: 1px solid #333;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }
        h2 { color: var(--neon); text-transform: uppercase; letter-spacing: 2px; }
        textarea {
            width: 100%;
            height: 100px;
            background: #000;
            border: 1px solid #444;
            border-radius: 12px;
            color: var(--neon);
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 14px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--neon);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00cc6e; transform: scale(1.02); }
        #resultBox {
            margin-top: 20px;
            padding: 15px;
            background: #000;
            border-radius: 12px;
            border: 1px dashed var(--neon);
            display: none;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .loader {
            display: none;
            margin: 10px auto;
            border: 3px solid #333;
            border-top: 3px solid var(--neon);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>MOV-AI FREE</h2>
    <p style="color: #888; font-size: 13px;">Nhập mô tả phim - AI sẽ đoán và xóa dấu vết</p>
    
    <textarea id="userInput" placeholder="Ví dụ: Phim về cậu bé hải tặc mũ rơm đi tìm kho báu..."></textarea>
    
    <button id="btn" onclick="askAI()">PHÂN TÍCH NGAY</button>
    
    <div id="loader" class="loader"></div>

    <div id="resultBox">
        <span style="font-size: 12px; color: #888;">Kết quả AI:</span>
        <div id="aiResponse" style="font-size: 18px; font-weight: bold; margin-top: 5px;"></div>
    </div>
</div>

<script>
    async function askAI() {
        const input = document.getElementById('userInput');
        const resBox = document.getElementById('resultBox');
        const resText = document.getElementById('aiResponse');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('btn');

        if (!input.value.trim()) return alert("Hãy nhập gì đó!");

        // Chuẩn bị dữ liệu
        const textToAsk = input.value;
        loader.style.display = "block";
        btn.disabled = true;
        resBox.style.display = "none";

        try {
            // Sử dụng API miễn phí của Hugging Face (Model chuyên về trả lời câu hỏi)
            const response = await fetch("https://api-inference.huggingface.co/models/facebook/blenderbot-400M-distill", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ inputs: "Trả lời ngắn gọn tên phim này là gì: " + textToAsk })
            });

            const data = await response.json();
            
            // Lấy kết quả trả về
            let answer = data.generated_text || data[0].generated_text || "Không tìm thấy phim này";
            
            // Hiển thị kết quả
            resText.innerText = answer;
            resBox.style.display = "block";

            // --- XOÁ DẤU VẾT ---
            input.value = ""; // Xóa nội dung đã nhập ngay lập tức
            console.clear();  // Xóa sạch log kỹ thuật
            
        } catch (error) {
            resText.innerText = "Lỗi kết nối server AI!";
            resBox.style.display = "block";
        } finally {
            loader.style.display = "none";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
