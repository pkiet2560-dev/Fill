<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Finder - Tìm Phim Thông Minh</title>
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }

        h1 { color: var(--primary-color); font-size: 2.5rem; }

        .search-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #2c2c2c;
            color: white;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); background-color: #ff0f1b; }

        #resultArea {
            margin-top: 30px;
            display: none; /* Ẩn khi chưa có kết quả */
            animation: fadeIn 0.5s ease;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            text-align: left;
            border-left: 5px solid var(--primary-color);
        }

        .movie-info { padding: 15px; }
        .movie-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        .movie-desc { font-size: 0.9rem; color: #ccc; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            display: none;
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>MOVIE AI</h1>
    <p>Nhập từ khóa, hành động hoặc link video để tìm tên phim</p>

    <div class="search-box">
        <textarea id="userInput" placeholder="Ví dụ: Phim có ông chú mặc giáp sắt đỏ bay trên trời, hoặc dán link video cảnh chiến đấu..."></textarea>
        
        <div class="input-group">
            <input type="text" id="videoLink" placeholder="Dán link video (YouTube/TikTok)...">
            <button onclick="findMovie()">TÌM PHIM</button>
        </div>
    </div>

    <div class="loading" id="loader"></div>

    <div id="resultArea">
        <h3>Kết quả tìm thấy:</h3>
        <div class="movie-card">
            <div class="movie-info">
                <div class="movie-title" id="resTitle">Tên phim sẽ hiện ở đây</div>
                <div class="movie-desc" id="resDesc">Mô tả tóm tắt về bộ phim dựa trên AI phân tích.</div>
            </div>
        </div>
    </div>
</div>

<script>
    function findMovie() {
        const input = document.getElementById('userInput').value;
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('resultArea');

        if (!input) {
            alert("Vui lòng nhập nội dung hoặc từ khóa!");
            return;
        }

        // Hiển thị hiệu ứng loading
        loader.style.display = "block";
        resultArea.style.display = "none";

        // Giả lập thời gian AI xử lý (2 giây)
        setTimeout(() => {
            loader.style.display = "none";
            resultArea.style.display = "block";

            // Logic giả lập trả về kết quả
            if (input.includes("giáp sắt") || input.includes("Iron Man")) {
                showResult("Iron Man (2008)", "Tỷ phú Tony Stark chế tạo bộ giáp công nghệ cao để chống lại tội phạm.");
            } else if (input.includes("đua xe") || input.includes("Tokyo")) {
                showResult("Fast & Furious: Tokyo Drift", "Hành trình đua xe đỉnh cao tại đường phố Tokyo Nhật Bản.");
            } else {
                showResult("Không tìm thấy chính xác", "Hãy thử nhập thêm các tình tiết cụ thể hơn (như tên nhân vật, hành động đặc trưng).");
            }
        }, 2000);
    }

    function showResult(title, desc) {
        document.getElementById('resTitle').innerText = title;
        document.getElementById('resDesc').innerText = desc;
    }
</script>

</body>
</html>
