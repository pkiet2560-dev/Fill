<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Finder - Xóa Dấu Vết</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0b0e14;
            --card: #161b22;
            --text: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }

        .input-area { margin-bottom: 20px; }

        textarea {
            width: 100%;
            height: 120px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            color: white;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea:focus { border-color: var(--primary); }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover { opacity: 0.8; transform: translateY(-2px); }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #0d1117;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            display: none;
        }

        .loading {
            text-align: center;
            display: none;
            color: var(--primary);
            font-style: italic;
        }

        .history-status {
            font-size: 12px;
            color: #6e7681;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>MOV-AI DETECTOR</h2>
    
    <div class="input-area">
        <textarea id="userInput" placeholder="Nhập từ khóa, lời thoại, hoặc mô tả cảnh phim tại đây..."></textarea>
    </div>

    <button onclick="processAI()">PHÂN TÍCH & TÌM TÊN PHIM</button>

    <div id="loader" class="loading">AI đang suy nghĩ và xóa dấu vết...</div>

    <div id="resultArea" class="result-box">
        <strong style="color: var(--primary);">Kết quả:</strong>
        <div id="movieName" style="font-size: 20px; margin-top: 10px;"></div>
    </div>

    <div class="history-status">Chế độ riêng tư: Lịch sử sẽ bị xóa sau khi tìm xong</div>
</div>

<script>
    async function processAI() {
        const inputField = document.getElementById('userInput');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('resultArea');
        const movieNameDisplay = document.getElementById('movieName');
        
        const apiKey = "DÁN_API_KEY_OPENAI_CỦA_BẠN_VÀO_ĐÂY"; // QUAN TRỌNG
        const text = inputField.value;

        if (!text) {
            alert("Vui lòng nhập nội dung!");
            return;
        }

        // Hiện loading và ẩn kết quả cũ
        loader.style.display = "block";
        resultArea.style.display = "none";

        try {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o", // Hoặc "gpt-3.5-turbo"
                    messages: [
                        { "role": "system", "content": "Bạn là máy nhận diện phim. Chỉ trả về TÊN PHIM duy nhất. Không giải thích thêm." },
                        { "role": "user", "content": `Dựa vào từ khóa/video này hãy đoán phim: ${text}` }
                    ],
                    temperature: 0.5
                })
            });

            const data = await response.json();
            const result = data.choices[0].message.content;

            // Hiển thị kết quả
            movieNameDisplay.innerText = result;
            resultArea.style.display = "block";

            // --- CƠ CHẾ XOÁ PHẦN GẦN ĐÂY ---
            inputField.value = ""; // Xóa trắng ô nhập liệu ngay lập tức
            console.clear();      // Xóa log rác trên trình duyệt
            
        } catch (error) {
            console.error("Lỗi:", error);
            alert("Không thể kết nối với AI. Kiểm tra lại API Key!");
        } finally {
            loader.style.display = "none";
        }
    }
</script>

</body>
</html>
